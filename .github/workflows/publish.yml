name: Latest pre-release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build with Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '26']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -Dmaven.compiler.release=${{ matrix.java }} clean package
      - name: Upload Java ${{ matrix.java }} jar
        uses: actions/upload-artifact@v4
        with:
          name: ginsim-java${{ matrix.java }}
          path: target/java${{ matrix.java }}/GINsim-*-jar-with-deps-java${{ matrix.java }}.jar
          if-no-files-found: error

  latest-release:
    name: Pre Release
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: true
          title: Development Build
          files: dist/*.jar