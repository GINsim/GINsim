name: Pull Request CI

on:
  pull_request:
    branches: [ publish ]

permissions:
  contents: read

jobs:
  build:
    name: Build with Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21', '25'] # all the LTS versions
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: Build and test
        run: mvn -B -Dmaven.compiler.release=${{ matrix.java }} clean package